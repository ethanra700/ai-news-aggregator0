[project]
name = "ai-news-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
    "openai>=1.60",
    "resend>=2.0",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "ipykernel>=7.4.0",
]
